<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenWall — Global Live Board</title>
    <style>
        /* Minimal style to make it functional */
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; }
        button { padding: 10px 15px; cursor: pointer; }
        .message-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .msg-meta { font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>
    <h1>OpenWall</h1>
    <div id="connection-status">Connecting...</div>
    <form id="message-form" onsubmit="postMessage(event)">
        <input type="text" id="recipient-input" placeholder="To" required>
        <input type="text" id="sender-input" placeholder="From" value="Anonymous">
        <textarea id="message-input" placeholder="Message" required></textarea>
        <button type="submit">Post Message</button>
    </form>
    <div id="feed-container"></div>
    <script>
        // High-stability free global JSON storage API
        const API_URL = "https://jsonbin.io";
        const API_KEY = "$2a$10$72T7mJjTzI78OonY7/02iO3gVbI09V7N.L2jR4M.2V7bN/mImsS2q";
        let activeMessages = [];
        
        async function fetchCloudMessages() {
            try {
                const response = await fetch(API_URL, { headers: { 'X-Master-Key': API_KEY, 'X-Bin-Meta': 'false' } });
                if (response.ok) {
                    activeMessages = await response.json();
                    renderFeed();
                }
            } catch (error) { console.error("Error:", error); }
        }

        async function postMessage(event) {
            event.preventDefault();
            const newMessage = {
                to: document.getElementById('recipient-input').value,
                from: document.getElementById('sender-input').value,
                body: document.getElementById('message-input').value,
                timestamp: Date.now()
            };
            activeMessages.unshift(newMessage);
            renderFeed();
            
            await fetch(API_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(activeMessages.slice(0, 50))
            });
            document.getElementById('message-input').value = '';
        }

        function renderFeed() {
            document.getElementById('feed-container').innerHTML = activeMessages.map(msg => `
                <div class="message-card">
                    <div class="msg-meta">To: ${msg.to} | From: ${msg.from}</div>
                    <div>${msg.body}</div>
                </div>
            `).join('');
        }
        
        setInterval(fetchCloudMessages, 5000);
        fetchCloudMessages();
    </script>
</body>
</html>
