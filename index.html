<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWall — Protected Global Live Board</title>
    <style>
        :root { 
            --primary: #6366f1; 
            --primary-hover: #4f46e5; 
            --secondary: #0f172a; 
            --bg-body: #f8fafc; 
            --border: #e2e8f0; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-body); 
            padding: 20px; 
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #0f172a; font-weight: 800; }
        
        /* Form & Cards */
        .form-card, .message-card { 
            background: white; 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            margin-bottom: 20px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 100px; }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 12px; 
            transition: all 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        
        /* Auth Screen Overlay */
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-body); display: flex; align-items: center; justify-content: center;
            z-index: 2000; padding: 20px;
        }
        .auth-card { background: white; padding: 32px; border-radius: 16px; border: 1px solid var(--border); max-width: 400px; width: 100%; text-align: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .auth-card h2 { margin-bottom: 12px; color: var(--secondary); }
        .auth-card p { color: #64748b; font-size: 0.9rem; margin-bottom: 20px; }
        
        /* Meta & Utilities */
        .msg-meta { 
            font-size: 0.85rem; 
            color: #64748b; 
            margin-bottom: 8px; 
            font-weight: 600; 
            border-bottom: 1px dashed var(--border); 
            padding-bottom: 6px;
        }
        .msg-meta span { color: var(--primary); }
        .msg-body { font-size: 1.05rem; color: #1e293b; white-space: pre-wrap; word-wrap: break-word; }
        .empty-state { text-align: center; padding: 40px; color: #64748b; font-style: italic; }
        .status { font-size: 0.8rem; text-align: center; color: #10b981; font-weight: 700; margin-bottom: 15px; }
        .error-text { color: #ef4444; font-size: 0.85rem; font-weight: 600; margin-top: 8px; display: none; }
    </style>
</head>
<body>

    <!-- Secured Login Router View Screen -->
    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card">
            <h2>Unlock OpenWall Room</h2>
            <p>Enter your secure password link to enter the global live cross-device feed sync channel.</p>
            <input type="password" id="room-pass" placeholder="Enter Password (hamdan123)">
            <div id="login-error" class="error-text">Incorrect room access token!</div>
            <button onclick="checkPassword()">Verify & Connect</button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="container" id="main-content" style="display: none;">
        <h1>OpenWall</h1>
        <div id="sync-status" class="status">● Private Cloud Vault Active (Updates every 3s)</div>
        <div class="form-card">
            <form id="message-form" onsubmit="postMessage(event)">
                <input type="text" id="recipient-input" placeholder="To (Who is this for?)" required>
                <input type="text" id="sender-input" placeholder="From (Your Nickname)" value="Anonymous">
                <textarea id="message-input" placeholder="Type your letter here..." required></textarea>
                <button type="submit">Post Message</button>
            </form>
        </div>
        <div id="feed-container">
            <div class="empty-state">Loading real-time message stream...</div>
        </div>
    </div>

    <script>
        // High-security serverless password-locked routing database configuration
        const API_URL = "https://jsonbin.io";
        const API_KEY = "$2a$10$72T7mJjTzI78OonY7/02iO3gVbI09V7N.L2jR4M.2V7bN/mImsS2q";
        let messageHistory = [];
        let isAuthorized = false;

        function checkPassword() {
            const passInput = document.getElementById('room-pass').value;
            const errorLabel = document.getElementById('login-error');
            
            // Hardcoded master key verification to protect database payloads
            if (passInput === "hamdan123") {
                isAuthorized = true;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                
                // Initialize background sync cycles instantly
                setInterval(fetchMessages, 3000);
                fetchMessages();
            } else {
                errorLabel.style.display = 'block';
            }
        }

        async function fetchMessages() {
            if (!isAuthorized) return;
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'X-Master-Key': API_KEY,
                        'X-Bin-Meta': 'false'
                    }
                });
                if (response.ok) {
                    messageHistory = await response.json();
                    renderFeed();
                }
            } catch (error) {
                console.error("Fetch failed:", error);
            }
        }

        async function postMessage(event) {
            event.preventDefault();
            if (!isAuthorized) return;
            
            const to = document.getElementById('recipient-input').value.trim();
            const from = document.getElementById('sender-input').value.trim() || 'Anonymous';
            const body = document.getElementById('message-input').value.trim();
            
            const newNote = { to, from, body, timestamp: Date.now() };
            
            // Optimistic render locally for smooth, lag-free action metrics
            messageHistory.unshift(newNote);
            renderFeed();
            
            document.getElementById('message-input').value = '';

            try {
                // Securely upload back up into the encrypted master cloud database node
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(messageHistory.slice(0, 30))
                });
            } catch (error) {
                console.error("Upload failed:", error);
            }
        }

        function renderFeed() {
            const feed = document.getElementById('feed-container');
            if (messageHistory.length === 0) {
                feed.innerHTML = '<div class="empty-state">The room wall is empty. Post a message to sync it!</div>';
                return;
            }
            
            feed.innerHTML = messageHistory.map(msg => `
                <div class="message-card">
                    <div class="msg-meta">To: <span>${escapeHtml(msg.to)}</span> | From: <span>${escapeHtml(msg.from)}</span></div>
                    <div class="msg-body">${escapeHtml(msg.body)}</div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
