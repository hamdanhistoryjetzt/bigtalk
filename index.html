<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWall — Cross-Device Global Live Board</title>
    <style>
        :root { 
            --primary: #6366f1; 
            --primary-hover: #4f46e5; 
            --bg-body: #f8fafc; 
            --border: #e2e8f0; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-body); 
            padding: 20px; 
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #0f172a; font-weight: 800; }
        .form-card, .message-card { 
            background: white; 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            margin-bottom: 20px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 100px; }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 12px; 
            transition: all 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        .msg-meta { 
            font-size: 0.85rem; 
            color: #64748b; 
            margin-bottom: 8px; 
            font-weight: 600; 
            border-bottom: 1px dashed var(--border); 
            padding-bottom: 6px;
        }
        .msg-meta span { color: var(--primary); }
        .msg-body { font-size: 1.05rem; color: #1e293b; white-space: pre-wrap; word-wrap: break-word; }
        .empty-state { text-align: center; padding: 40px; color: #64748b; font-style: italic; }
        .status { font-size: 0.8rem; text-align: center; color: #10b981; font-weight: 700; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OpenWall</h1>
        <div class="status">● Cloud Sync Active (Auto-Refreshes every 4s)</div>
        <div class="form-card">
            <form id="message-form" onsubmit="postMessage(event)">
                <input type="text" id="recipient-input" placeholder="To (Who is this for?)" required>
                <input type="text" id="sender-input" placeholder="From (Your Nickname)" value="Anonymous">
                <textarea id="message-input" placeholder="Type your note here..." required></textarea>
                <button type="submit">Post Message</button>
            </form>
        </div>
        <div id="feed-container">
            <div class="empty-state">Connecting to global feed stream...</div>
        </div>
    </div>

    <script>
        // Open global cloud bin configuration
        const API_URL = "https://jsonbin.io";
        const API_KEY = "$2a$10$72T7mJjTzI78OonY7/02iO3gVbI09V7N.L2jR4M.2V7bN/mImsS2q";
        let messageHistory = [];

        async function fetchMessages() {
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'X-Master-Key': API_KEY,
                        'X-Bin-Meta': 'false'
                    }
                });
                if (response.ok) {
                    messageHistory = await response.json();
                    renderFeed();
                }
            } catch (error) {
                console.error("Fetch failed:", error);
            }
        }

        async function postMessage(event) {
            event.preventDefault();
            
            const to = document.getElementById('recipient-input').value.trim();
            const from = document.getElementById('sender-input').value.trim() || 'Anonymous';
            const body = document.getElementById('message-input').value.trim();
            
            const newNote = { to, from, body };
            
            // Add to screen instantly
            messageHistory.unshift(newNote);
            renderFeed();
            
            // Clear input box
            document.getElementById('message-input').value = '';

            // Upload directly to global cloud server
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(messageHistory.slice(0, 30)) // keeps top 30 messages
                });
            } catch (error) {
                console.error("Upload failed:", error);
            }
        }

        function renderFeed() {
            const feed = document.getElementById('feed-container');
            if (messageHistory.length === 0) {
                feed.innerHTML = '<div class="empty-state">The wall is completely blank. Write the first note!</div>';
                return;
            }
            
            feed.innerHTML = messageHistory.map(msg => `
                <div class="message-card">
                    <div class="msg-meta">To: <span>${escapeHtml(msg.to)}</span> | From: <span>${escapeHtml(msg.from)}</span></div>
                    <div class="msg-body">${escapeHtml(msg.body)}</div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Check for new posts globally every 4 seconds
        setInterval(fetchMessages, 4000);
        fetchMessages();
    </script>
</body>
</html>
