<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message the Host</title>
    <!-- Modern Tailwind CSS v4 Engine -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-md max-w-md w-full border border-slate-100">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Contact the Host</h1>
        <p class="text-slate-500 mb-6 text-sm">Send a message below. It will deliver straight to my personal inbox.</p>
        
        <!-- Replace YOUR_FORM_ID with the key provided by Formspree -->
        <form action="https://formspree.io" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Your Email Address</label>
                <input type="email" name="email" required 
                       class="w-full p-3 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 transition-colors" 
                       placeholder="you@example.com">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Your Message</label>
                <textarea name="message" required rows="4" 
                          class="w-full p-3 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 transition-colors resize-none" 
                          placeholder="Type your message here..."></textarea>
            </div>
            
            <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium p-3 rounded-lg transition-colors cursor-pointer text-center">
                Send Message
            </button>
        </form>
    </div>

</body>
</html>
