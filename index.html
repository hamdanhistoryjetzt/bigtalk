<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWall — Global Live Board</title>
    <style>
        /* Simplified styles for brevity */
        :root { --primary: #6366f1; --secondary: #0f172a; --bg-body: #f8fafc; }
        body { font-family: sans-serif; background-color: var(--bg-body); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; padding: 40px 0; }
        .form-card, .message-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #e2e8f0; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; }
        .msg-meta { font-size: 0.85rem; color: #64748b; margin-bottom: 10px; }
        .msg-body { white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>OpenWall</h1></header>
        <div class="form-card">
            <form id="message-form" onsubmit="postMessage(event)">
                <input type="text" id="recipient-input" placeholder="To" required>
                <input type="text" id="sender-input" placeholder="From" value="Anonymous">
                <textarea id="message-input" placeholder="Message" required></textarea>
                <button type="submit">Publish</button>
            </form>
        </div>
        <div id="feed-container"></div>
    </div>
    <script>
        // Combined HTML/JS structure as requested
        const RELAY = "wss://relay.nostr.band";
        const socket = new WebSocket(RELAY);
        const APP_TAG = "bigtalk_global_historyjetzt_v4";
        let activeMessages = [];

        socket.onopen = () => {
            const sub = ["REQ", "sub1", {kinds: [1], "#t": [APP_TAG], limit: 20}];
            socket.send(JSON.stringify(sub));
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data[0] === "EVENT" && data[2]) {
                try {
                    const content = JSON.parse(data[2].content);
                    activeMessages.unshift(content);
                    renderFeed();
                } catch(e) {}
            }
        };

        function postMessage(e) {
            e.preventDefault();
            const msg = {
                to: document.getElementById('recipient-input').value,
                from: document.getElementById('sender-input').value,
                body: document.getElementById('message-input').value
            };
            const event = {
                kind: 1, created_at: Math.floor(Date.now()/1000),
                tags: [["t", APP_TAG]], content: JSON.stringify(msg)
            };
            socket.send(JSON.stringify(["EVENT", event]));
            e.target.reset();
        }

        function renderFeed() {
            document.getElementById('feed-container').innerHTML = activeMessages.map(m => `
                <div class="message-card">
                    <div class="msg-meta">To: ${m.to} | From: ${m.from}</div>
                    <div class="msg-body">${m.body}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
