<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWall — True Cross-Device Live Board</title>
    <style>
        :root { 
            --primary: #6366f1; 
            --primary-hover: #4f46e5; 
            --bg-body: #f8fafc; 
            --border: #e2e8f0; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-body); 
            padding: 20px; 
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #0f172a; font-weight: 800; }
        .form-card, .message-card { 
            background: white; 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            margin-bottom: 20px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 100px; }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 12px; 
            transition: all 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        .msg-meta { 
            font-size: 0.85rem; 
            color: #64748b; 
            margin-bottom: 8px; 
            font-weight: 600; 
            border-bottom: 1px dashed var(--border); 
            padding-bottom: 6px;
        }
        .msg-meta span { color: var(--primary); }
        .msg-body { font-size: 1.05rem; color: #1e293b; white-space: pre-wrap; word-wrap: break-word; }
        .empty-state { text-align: center; padding: 40px; color: #64748b; font-style: italic; }
        .status { font-size: 0.8rem; text-align: center; color: #10b981; font-weight: 700; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OpenWall</h1>
        <div id="sync-status" class="status">● Connecting to Google Firebase...</div>
        <div class="form-card">
            <form id="message-form" onsubmit="postMessage(event)">
                <input type="text" id="recipient-input" placeholder="To (Who is this for?)" required>
                <input type="text" id="sender-input" placeholder="From (Your Nickname)" value="Anonymous">
                <textarea id="message-input" placeholder="Type your note here..." required></textarea>
                <button type="submit">Post Message</button>
            </form>
        </div>
        <div id="feed-container">
            <div class="empty-state">Loading real-time message stream...</div>
        </div>
    </div>

    <!-- Load Google Firebase Library Framework scripts over HTTPS -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // Official Firebase Realtime Configuration Pointer
        const firebaseConfig = {
            databaseURL: "https://firebaseio.com"
        };
        
        // Initialize Firebase instance variables
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const messagesRef = database.ref('messages');

        // Real-time listener: Triggers completely automatically whenever data changes on ANY device
        messagesRef.orderByChild('timestamp').limitToLast(40).on('value', (snapshot) => {
            document.getElementById('sync-status').innerText = "● Firebase Live Sync Connected";
            
            const rawData = snapshot.val();
            let messagesList = [];
            
            if (rawData) {
                // Convert Firebase object hash map structures to ordered javascript array matrix lists
                Object.keys(rawData).forEach(key => {
                    messagesList.push(rawData[key]);
                });
                // Sort absolute descending timestamps to show new notes first
                messagesList.sort((a, b) => b.timestamp - a.timestamp);
            }
            
            renderFeed(messagesList);
        }, (error) => {
            document.getElementById('sync-status').innerText = "✕ Connection blocked or restricted";
            console.error(error);
        });

        function postMessage(event) {
            event.preventDefault();
            
            const to = document.getElementById('recipient-input').value.trim();
            const from = document.getElementById('sender-input').value.trim() || 'Anonymous';
            const body = document.getElementById('message-input').value.trim();
            
            const newNote = {
                to: to,
                from: from,
                body: body,
                timestamp: Date.now()
            };
            
            // Push directly straight up to Google Cloud cluster database
            messagesRef.push(newNote);
            
            // Wipe message field
            document.getElementById('message-input').value = '';
        }

        function renderFeed(list) {
            const feed = document.getElementById('feed-container');
            if (list.length === 0) {
                feed.innerHTML = '<div class="empty-state">The wall is completely blank. Write the first live note!</div>';
                return;
            }
            
            feed.innerHTML = list.map(msg => `
                <div class="message-card">
                    <div class="msg-meta">To: <span>${escapeHtml(msg.to)}</span> | From: <span>${escapeHtml(msg.from)}</span></div>
                    <div class="msg-body">${escapeHtml(msg.body)}</div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
